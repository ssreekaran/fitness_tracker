<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ft_favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- App Description -->
    <meta
      name="description"
      content="A secure fitness tracking application for managing workouts, nutrition, and health goals."
    />
    <meta
      name="keywords"
      content="fitness, health, workout, nutrition, tracker, secure"
    />

    <!-- No external CDN styles/scripts: Bootstrap CSS is bundled locally
         (imported in src/main.tsx from the bootstrap npm package) so the
         app does not depend on third-party CDNs at runtime. The w3.css and
         Google Fonts links previously here were unused and have been removed. -->
    <title>Fitness Tracker - Secure Health & Fitness Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
