name: Android CI/CD

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual triggers

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
      
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./fitness_tracker
      run: |
        npm ci
        npm install -g @capacitor/cli @capacitor/android
        
    - name: Build web assets
      working-directory: ./fitness_tracker
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      run: |
        npm run build
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'build-tools;34.0.0 platform-tools platform;android-34 ndk;25.1.8937393 cmake;3.22.1'
      env:
        ANDROID_HOME: ${{ github.workspace }}/android-sdk
        ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        
    - name: Initialize Android project
      working-directory: ./fitness_tracker
      run: |
        # Remove existing android directory
        rm -rf android
        # Initialize Android project
        npx cap add android
        
        # Navigate to android directory and set up Gradle wrapper
        cd android
        ./gradlew wrapper --gradle-version=8.0 --distribution-type=all
        
        # Create local.properties with Android SDK path
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Ensure gradlew is executable
        chmod +x gradlew
        
        # Sync Gradle to download dependencies
        ./gradlew --version
        
    - name: Build Android App Bundle
      working-directory: ./fitness_tracker/android
      env:
        KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      run: |
        ./gradlew clean bundleRelease --info --stacktrace --no-daemon
        
    - name: Upload AAB
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: ./fitness_tracker/android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 7
