name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Check if Firebase service account is available
        id: check-firebase-secret
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_TRACKER_CLEAN }}" ]; then
            echo "firebase-available=true" >> $GITHUB_OUTPUT
          else
            echo "firebase-available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Firebase service account secret not found. Skipping deployment."
            echo "To enable automatic deployment, add FIREBASE_SERVICE_ACCOUNT_FITNESS_TRACKER_CLEAN to your repository secrets."
          fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.check-firebase-secret.outputs.firebase-available == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_TRACKER_CLEAN }}
          projectId: fitness-tracker-clean
          channelId: live

      - name: Manual deployment instructions
        if: steps.check-firebase-secret.outputs.firebase-available == 'false'
        run: |
          echo "🚀 To deploy manually, run:"
          echo "   npm run build"
          echo "   firebase deploy --only hosting"
          echo ""
          echo "📋 To enable automatic deployment:"
          echo "1. Go to Firebase Console > Project Settings > Service Accounts"
          echo "2. Generate a new private key"
          echo "3. Add the JSON content as FIREBASE_SERVICE_ACCOUNT_FITNESS_TRACKER_CLEAN secret in GitHub"
